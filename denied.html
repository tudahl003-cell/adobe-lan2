<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Adobe Acrobat</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
    body { background:#f7f7f8; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:#fff; border:1px solid #e5e5e5; border-radius:14px; max-width:420px; width:100%;
      padding:40px 32px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .mark { width:52px; height:52px; border-radius:10px; background:#eb1000; color:#fff; font-weight:800;
      font-size:30px; font-family:Georgia,serif; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
    h1 { font-size:20px; font-weight:700; margin-bottom:12px; }
    p { color:#5b5b5b; font-size:15px; line-height:1.6; }
    .hint { margin-top:20px; font-size:13px; color:#8a8a8a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">A</div>
    <h1>Open on a computer</h1>
    <p>This Adobe Acrobat installer is available for Windows and desktop browsers. Please open it on a PC or Mac to download and install.</p>
    <div class="hint">If you received this in an email, tap the link on a computer.</div>
  </div>
</body>
</html>
